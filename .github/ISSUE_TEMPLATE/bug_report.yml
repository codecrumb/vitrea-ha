name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Shown in HACS, or in custom_components/vitrea/manifest.json
    validations: {required: true}
  - type: input
    id: vbox
    attributes:
      label: V-Box model / firmware (if known)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Add to configuration.yaml, restart, reproduce, then paste the relevant lines:
        ```yaml
        logger:
          logs:
            custom_components.vitrea: debug
        ```
      render: text
