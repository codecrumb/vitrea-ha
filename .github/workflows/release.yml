name: Release

# Push a tag like v1.0.0 to build and publish a release. HACS can install
# straight from the repo contents without this, but it also gives anyone
# who wants to install manually a ready-made zip to drop into
# custom_components/.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the integration
        # HACS's zip_release extracts this archive's contents directly
        # into custom_components/vitrea/ — so the zip must contain the
        # files at its root, NOT a wrapping vitrea/ folder (that nests
        # as custom_components/vitrea/vitrea/, confirmed on a real box
        # with v0.2.1 before this fix).
        run: |
          cd custom_components/vitrea
          zip -r ../../vitrea-ha.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: vitrea-ha.zip
          generate_release_notes: true
          # A tag with a hyphen (v0.5.0-beta.1) is a pre-release: HACS only
          # offers it when "Show beta versions" is on.
          prerelease: ${{ contains(github.ref_name, '-') }}
