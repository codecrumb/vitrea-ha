name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_hub_simple.py
      - run: python3 tests/test_simple_client.py
      - run: python3 tests/test_admin_client.py
      - run: python3 tests/test_mobile_client.py
